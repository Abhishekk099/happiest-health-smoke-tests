serenity {
    take.screenshots = FOR_FAILURES
}

webdriver {
	capabilities {
        "goog:chromeOptions" {
                  args = ["enable-automation","--headless", "--window-size=1920,1080","--no-sandbox","--disable-extensions","--dns-prefetch-disable","--disable-gpu"]
        }
    }
	timeouts {
    implicitlywait = 25000
    fluentwait = 20000
  }
}
headless.mode = false
environments {
    default {
        HappiestHealth = "https://qa.staging.happiesthealth.com"
        HappiestHealthCMS = "https://qa.staging.happiesthealth.com/wp-login"
        HappiestHealthVideoPage = "https://staging-dev.happiesthealth.com/hvideos"
        HappiestHealthEvolution = "https://qa.staging.happiesthealth.com/evolution"
        AAEAdmin = "https://qa.staging.happiesthealth.com/community/admin"
        rest.base.url = "https://qa.staging.happiesthealth.com"
    }
    dev {
        HappiestHealth = "https://staging-dev.happiesthealth.com"
        HappiestHealthCMS = "https://staging-dev.happiesthealth.com/wp-login"
        HappiestHealthVideoPage = "https://staging-dev.happiesthealth.com/hvideos"
        HappiestHealthEvolution = "https://staging-dev.happiesthealth.com/evolution"
        AAEAdmin = "https://staging3.happiesthealth.com/community/admin"
    }
    stg3{
            HappiestHealthEvolution = "https://staging3.happiesthealth.com"
            AAEAdmin = "https://staging3.happiesthealth.com/community/admin"
            HappiestHealthCMS = "https://staging3.happiesthealth.com/happycmsadm20"
            rest.base.url = "https://staging3.staging.happiesthealth.com"
    }

    prod {
            HappiestHealthEvolution = "https://happiesthealth.com"
        }

    qa {
            HappiestHealth = "https://qa.staging.happiesthealth.com"
            HappiestHealthCMS = "https://qa.staging.happiesthealth.com/wp-login"
            HappiestHealthVideoPage = "https://qa.staging.happiesthealth.com/hvideos"
            HappiestHealthEvolution = "https://qa.staging.happiesthealth.com"
            AAEAdmin = "https://qa.staging.happiesthealth.com/community/admin"
            rest.base.url = "https://qa.staging.happiesthealth.com"

     mobile{
            HappiestHealth = "https://qa.staging.happiesthealth.com"
            HappiestHealthCMS = "https://qa.staging.happiesthealth.com/wp-login"
            HappiestHealthVideoPage = "https://qa.staging.happiesthealth.com/hvideos"
            HappiestHealthEvolution = "https://staging3.happiesthealth.com/"
            webdriver {
                driver = edge
                edge.switches = ["--window-size=375,812"]
                capabilities {
                    "ms:edgeOptions" {
                        mobileEmulation {
                            deviceName = "iPhone X"
                        }
                    }
                }
            }

     }
    }
}

